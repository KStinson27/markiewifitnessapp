<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach Dashboard · Material UI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F5; font-family: Roboto, system-ui, sans-serif; color: rgba(0,0,0,0.87)">
<header style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 24px; background: {{primary}}; color: #FFFFFF; box-shadow: 0px 2px 4px -1px rgba(0,0,0,0.2), 0px 4px 5px 0px rgba(0,0,0,0.14), 0px 1px 10px 0px rgba(0,0,0,0.12)">
<div style="flex: 1; font-size: 20px; font-weight: 500">[MARKIEWI FITNESS]</div>
<label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.15); min-width: 0; flex: 0 1 280px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.search}}"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search clients</span>
<input placeholder="Search clients" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 15px">
</label>
<button type="button" aria-label="Notifications" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.bell}}"></path></svg></button>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap">
<nav aria-label="Dashboard" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid rgba(0,0,0,0.12); padding: 8px 0">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 24px; min-height: 48px; padding: 0 16px; text-decoration: none; font-size: 15px; color: rgba(0,0,0,0.87); background: {{n.bg}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="{{n.fg}}"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 28px; font-weight: 400">Good morning, Coach</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid rgba(0,106,96,0.5); background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.personAdd}}"></path></svg>Invite client</button>
<button type="button" style="height: 36px; padding: 0 16px; border-radius: 4px; border: 0; background: {{primary}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; box-shadow: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.campaign}}"></path></svg>Broadcast</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 4px; padding: 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12)">
<div style="width: 48px; height: 48px; border-radius: 24px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{s.icon}}"></path></svg></div>
<div><div style="font-size: 14px; color: rgba(0,0,0,0.6)">{{s.label}}</div><div style="font-size: 28px">{{s.value}}</div></div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 2 1 520px; min-width: 0; background: #FFFFFF; border-radius: 4px; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12)">
<h2 style="margin: 0; padding: 16px; font-size: 18px; font-weight: 500">Clients</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 600px; border-collapse: collapse; font-size: 14px">
<thead><tr style="text-align: left"><th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.12)">Client</th><th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.12)">Program</th><th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.12)">Workouts (7d)</th><th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.12)">Nutrition</th><th style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.12)">Status</th></tr></thead>
<tbody>
<sc-for list="{{clients}}" as="c" hint-placeholder-count="4">
<tr>
<td style="padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.12)"><div style="display: flex; align-items: center; gap: 12px"><span style="width: 32px; height: 32px; border-radius: 16px; background: #BDBDBD; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px">{{c.initials}}</span>{{c.name}}</div></td>
<td style="padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.12)">{{c.program}}</td>
<td style="padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.12)"><div style="display: flex; align-items: center; gap: 8px">{{c.done}}<div style="width: 64px; height: 4px; border-radius: 2px; background: #E0E0E0"><div style="width: {{c.pct}}; height: 4px; border-radius: 2px; background: #2A78D6"></div></div></div></td>
<td style="padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.12)">{{c.nutrition}}</td>
<td style="padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.12)"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 13px; background: {{c.chipBg}}; color: {{c.chipFg}}">{{c.status}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 4px; padding: 8px 0; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12)">
<h2 style="margin: 0; padding: 8px 16px 12px; font-size: 18px; font-weight: 500">Review inbox</h2>
<sc-for list="{{inbox}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 0 16px; border-top: 1px solid rgba(0,0,0,0.12)">
<div style="width: 40px; height: 40px; border-radius: 20px; background: #E3F2EF; color: {{primary}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="{{r.icon}}"></path></svg></div>
<div style="flex: 1; min-width: 0"><div style="font-size: 15px">{{r.title}}</div><div style="font-size: 13px; color: rgba(0,0,0,0.6)">{{r.sub}}</div></div>
</div>
</sc-for>
<div style="padding: 8px 8px 0; border-top: 1px solid rgba(0,0,0,0.12)"><button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase">Open inbox</button></div>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#006A60","options":["#006A60","#3F51B5","#9C4146","#4F5B92"]},"$preview":{"width":1280,"height":900}}'>

    const ic = {

      { label: 'Exercise library', href: '#', icon: ic.library },

</script>
</body>
</html>
