<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Challenge · Material</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: Roboto, system-ui, sans-serif; color: #161D1C">
<header style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 4px; flex-shrink: 0">
<a href="M3Today.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: #161D1C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.back}}"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 400">Fall Reset Challenge</h1>
<button type="button" aria-label="Share challenge" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #3F4947; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.share}}"></path></svg></button>
</header>

<div style="flex: 1; overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<section style="background: #4F3FB8; color: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.trophy}}"></path></svg><div style="flex: 1"><div style="font-size: 14px; opacity: 0.9">Team Kettlebell · Rank #4 of 23</div><div style="font-size: 24px">231 pts</div></div></div>
<div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35)"><div style="width: 30%; height: 4px; border-radius: 2px; background: #FFFFFF"></div></div>
<div style="font-size: 13px; opacity: 0.9">Day 9 of 30 · Oct 12 – Nov 10</div>
</section>

<section style="background: #FFFFFF; border-radius: 16px; padding: 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 1px 3px 1px rgba(0,0,0,0.06)">
<div style="display: flex; justify-content: space-between; padding: 8px 16px; font-size: 14px; font-weight: 500; color: #3F4947"><span>Today</span><span>10 / 30 pts</span></div>
<div style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 16px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#3F4947"><path d="{{ic.walk}}"></path></svg><div style="flex: 1"><div style="font-size: 16px">10,000 steps</div><div style="height: 4px; border-radius: 2px; background: #DAE5E1; margin-top: 8px"><div style="width: 64%; height: 4px; border-radius: 2px; background: #6250D6"></div></div></div><span style="font-size: 12px; color: #3F4947">6,412 · auto</span></div>
<label style="display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 16px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#3F4947"><path d="{{ic.food}}"></path></svg><span style="flex: 1; font-size: 16px">Log all meals · 10 pts</span><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #6250D6"></label>
<label style="display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 16px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#3F4947"><path d="{{ic.mobility}}"></path></svg><span style="flex: 1; font-size: 16px">10 min mobility · 10 pts</span><input type="checkbox" style="width: 20px; height: 20px; accent-color: #6250D6"></label>
</section>

<div role="group" aria-label="Leaderboard view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #6F7977; border-radius: 20px; overflow: hidden; height: 40px">
<button type="button" style="border: 0; border-right: 1px solid #6F7977; background: #ECE9FB; color: #2A1F6E; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.check}}"></path></svg>Individuals</button>
<button type="button" style="border: 0; background: transparent; color: #161D1C; font: inherit; font-size: 14px; font-weight: 500">Teams</button>
</div>

<section style="background: #FFFFFF; border-radius: 16px; padding: 4px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 1px 3px 1px rgba(0,0,0,0.06)">
<sc-for list="{{board}}" as="p" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; background: {{p.bg}}">
<span style="width: 20px; font-size: 14px; font-weight: 500; color: #3F4947">{{p.rank}}</span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: {{p.avatar}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">{{p.initials}}</span>
<span style="flex: 1; font-size: 16px">{{p.name}}<span style="font-size: 12px; color: #3F4947">{{p.tag}}</span></span>
<span style="font-size: 16px; font-weight: 500">{{p.pts}}</span>
</div>
</sc-for>
</section>

<section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 1px 3px 1px rgba(0,0,0,0.06)">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; border-radius: 18px; background: #E3E1EC; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">MS</span><div style="flex: 1"><div style="font-size: 14px; font-weight: 500">Maria S.</div><div style="font-size: 12px; color: #3F4947">2h ago</div></div></div>
<div style="font-size: 14px">Hit a 7-day streak on all three habits!</div>
<div style="display: flex; gap: 8px">
<button type="button" style="height: 32px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid #6F7977; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #3F4947; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#B3261E"><path d="{{ic.heart}}"></path></svg>8</button>
<button type="button" style="height: 32px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid #6F7977; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #3F4947; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.chat}}"></path></svg>Comment</button>
</div>
</section>

<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 16px"><span style="flex: 1">Show me on the leaderboard</span><input type="checkbox" role="switch" checked style="width: 22px; height: 22px; accent-color: #6250D6"></label>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 80px; background: #F5F5F5; flex-shrink: 0; padding-bottom: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #3F4947; font-size: 12px; font-weight: 500">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}; color: {{t.fg}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{t.icon}}"></path></svg></span>{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#006A60","options":["#006A60","#3F51B5","#9C4146","#4F5B92"]},"$preview":{"width":390,"height":844}}'>

}
</script>
</body>
</html>
