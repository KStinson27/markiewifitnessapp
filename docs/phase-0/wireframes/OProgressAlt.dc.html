<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress · Orion-style charts (alt)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: Roboto, system-ui, sans-serif; color: #161D1C">
<header style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 4px 0 16px; flex-shrink: 0">
<h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 400">Progress</h1>
</header>
<div style="flex: 1; overflow: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div role="group" aria-label="Time range" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F2F4F8">
<sc-for list="{{ranges}}" as="r" hint-placeholder-count="4"><button type="button" aria-pressed="{{r.on}}" style="height: 32px; border: 0; border-radius: 9px; background: {{r.bg}}; box-shadow: {{r.sh}}; font: inherit; font-size: 13px; font-weight: 500; color: {{r.fg}}">{{r.label}}</button></sc-for>
</div>

<section style="border: 1px solid #ECEEF3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(16,24,40,0.05)">
<div style="font-size: 13px; font-weight: 500; color: #5B6170">Weight</div>
<div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
<span style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em">162.4</span><span style="font-size: 14px; color: #5B6170">lb</span>
<span style="height: 24px; padding: 0 8px; border-radius: 12px; background: #E8F1FC; color: #1A5BA8; font-size: 12px; font-weight: 500; display: flex; align-items: center">−3.6 lb · 7 weeks</span>
</div>
<div style="position: relative">
<svg role="img" aria-label="Weight trend from 166.0 lb on Sep 1 to 162.4 lb on Oct 20; goal 155 lb" viewBox="0 0 326 190" style="display: block; width: 100%; height: auto">
<defs><linearGradient id="opw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A78D6" stop-opacity="0.2"></stop><stop offset="1" stop-color="#2A78D6" stop-opacity="0"></stop></linearGradient></defs>
<sc-for list="{{c.grid}}" as="g" hint-placeholder-count="3"><line x1="30" x2="322" y1="{{g.y}}" y2="{{g.y}}" stroke="#E6E9F0" stroke-dasharray="3 4"></line><text x="24" y="{{g.ty}}" text-anchor="end" font-size="10" fill="#5B6170">{{g.l}}</text></sc-for>
<line x1="30" x2="322" y1="{{c.goal}}" y2="{{c.goal}}" stroke="#1BAF7A" stroke-width="1.5" stroke-dasharray="6 4"></line>
<text x="320" y="{{c.goalT}}" text-anchor="end" font-size="10" font-weight="500" fill="#0E7A55">Goal 155</text>
<path d="{{c.area}}" fill="url(#opw)"></path>
<path d="{{c.line}}" fill="none" stroke="#2A78D6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
<line x1="{{c.lx}}" x2="{{c.lx}}" y1="8" y2="160" stroke="#C5CBD6" stroke-dasharray="2 3"></line>
<circle cx="{{c.lx}}" cy="{{c.ly}}" r="5.5" fill="#FFFFFF" stroke="#2A78D6" stroke-width="2.5"></circle>
<sc-for list="{{c.x}}" as="x" hint-placeholder-count="3"><text x="{{x.x}}" y="180" text-anchor="middle" font-size="10" fill="#5B6170">{{x.l}}</text></sc-for>
</svg>
<div role="tooltip" style="position: absolute; right: 18px; top: 6px; background: #1B1F2B; color: #FFFFFF; border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.35"><div style="font-weight: 600">162.4 lb</div><div style="opacity: 0.75">Oct 20 · Apple Health</div></div>
</div>
<div style="display: flex; gap: 8px; margin-top: 4px">
<button type="button" style="flex: 1; height: 40px; border: 0; border-radius: 20px; background: #006A60; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500">Log weight</button>
<button type="button" style="flex: 1; height: 40px; border: 0; border-radius: 20px; background: #CCE8E2; color: #051F1C; font: inherit; font-size: 14px; font-weight: 500">Measurements</button>
</div>
</section>

<section style="border: 1px solid #ECEEF3; border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.05)">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5B6170; margin-bottom: 4px"><span style="font-weight: 500">Measurements</span><span>Since Sep 1</span></div>
<sc-for list="{{meas}}" as="m" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 10px; align-items: center; min-height: 46px; border-top: 1px solid #F0F2F6">
<div><div style="font-size: 15px">{{m.n}}</div><div style="font-size: 12px; color: #5B6170">{{m.now}}</div></div>
<svg role="img" aria-label="{{m.n}} trend" viewBox="0 0 72 26" width="72" height="26"><path d="{{m.p}}" fill="none" stroke="#2A78D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="{{m.ex}}" cy="{{m.ey}}" r="3" fill="#2A78D6"></circle></svg>
<span style="justify-self: end; height: 24px; padding: 0 8px; border-radius: 12px; background: #F2F4F8; color: #161D1C; font-size: 12px; font-weight: 500; display: flex; align-items: center">{{m.d}}</span>
</div>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [166.0, 165.4, 165.1, 164.2, 164.5, 163.6, 163.0, 162.4];
    const dates = ['Sep 1', '', '', '', 'Sep 29', '', '', 'Oct 20'];
    const x0 = 36, x1 = 314, yT = 10, yB = 160, lo = 154, hi = 167;
    const sx = (i) => x0 + i * (x1 - x0) / 7;
    const sy = (v) => yB - (v - lo) / (hi - lo) * (yB - yT);
    const line = pts.map((v, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(v).toFixed(1)).join(' ');
    const c = {
      line, area: line + ' L' + sx(7).toFixed(1) + ' ' + yB + ' L' + sx(0).toFixed(1) + ' ' + yB + ' Z',
      lx: sx(7), ly: sy(162.4), goal: sy(155), goalT: sy(155) - 5,
      grid: [160, 165].map((v) => ({ y: sy(v), ty: sy(v) + 3, l: String(v) })),
      x: dates.map((l, i) => ({ l, x: sx(i) })).filter((d) => d.l)
    };
    const spark = (vals) => {
      const mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
      const X = (i) => 4 + i * 64 / (vals.length - 1), Y = (v) => 22 - (v - mn) / sp * 18;
      return { p: vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' '), ex: X(vals.length - 1), ey: Y(vals[vals.length - 1]) };
    };
    const meas = [
      ['Waist', '32.5 in', '−1.5 in', [34.0, 33.6, 33.1, 32.5]],
      ['Hips', '40.2 in', '−0.8 in', [41.0, 40.8, 40.5, 40.2]],
      ['Chest', '39.0 in', '−0.5 in', [39.5, 39.4, 39.1, 39.0]],
      ['Arm (right)', '13.2 in', '+0.2 in', [13.0, 13.0, 13.1, 13.2]],
      ['Body fat', '26.1%', '−1.9 pts', [28.0, 27.4, 26.8, 26.1]]
    ].map(([n, now, d, s]) => ({ n, now, d, ...spark(s) }));
    const ranges = ['1M', '3M', '6M', 'All'].map((label, i) => ({
      label, on: i === 1, bg: i === 1 ? '#FFFFFF' : 'transparent', sh: i === 1 ? '0 1px 2px rgba(16,24,40,0.12)' : 'none', fg: i === 1 ? '#161D1C' : '#5B6170'
    }));
    return { c, meas, ranges };
  }
}
</script>
</body>
</html>
