<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Program Builder · Material UI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F5; font-family: Roboto, system-ui, sans-serif; color: rgba(0,0,0,0.87)">
<header style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 16px; background: {{primary}}; color: #FFFFFF; box-shadow: 0px 2px 4px -1px rgba(0,0,0,0.2), 0px 4px 5px 0px rgba(0,0,0,0.14), 0px 1px 10px 0px rgba(0,0,0,0.12)">
<a href="M3ProgramLibrary.dc.html" aria-label="Back to programs" style="width: 40px; height: 40px; border-radius: 20px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.back}}"></path></svg></a>
<div style="flex: 1; min-width: 0"><div style="font-size: 20px; font-weight: 500">Strength Foundations</div><div style="font-size: 13px; opacity: 0.85">Template · 3 phases · 12 weeks · 3 days/week</div></div>
<button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.copy}}"></path></svg>Duplicate week</button>
<a href="M3ProgramCalendar.dc.html" style="height: 36px; padding: 0 16px; border-radius: 4px; background: #FFFFFF; color: {{primary}}; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.assign}}"></path></svg>Assign</a>
</header>

<div role="tablist" aria-label="Weeks" style="display: flex; overflow-x: auto; background: #FFFFFF; border-bottom: 1px solid rgba(0,0,0,0.12); padding: 0 16px">
<sc-for list="{{weeks}}" as="w" hint-placeholder-count="6">
<button type="button" role="tab" aria-selected="{{w.on}}" style="flex-shrink: 0; min-height: 48px; padding: 0 16px; border: 0; border-bottom: 2px solid {{w.line}}; background: transparent; color: {{w.fg}}; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase">{{w.label}}</button>
</sc-for>
</div>

<main style="width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<aside style="flex: 1 1 260px; min-width: 0; background: #FFFFFF; border-radius: 4px; padding: 16px 0 8px; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12)">
<h2 style="margin: 0; padding: 0 16px 12px; font-size: 18px; font-weight: 500">Exercise library</h2>
<div style="padding: 0 16px 12px">
<label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border: 1px solid rgba(0,0,0,0.23); border-radius: 4px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="rgba(0,0,0,0.54)"><path d="{{ic.search}}"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search exercises</span>
<input placeholder="Search 800+ exercises" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px">
</label>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px">
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{primary}}; color: #FFFFFF; font-size: 13px; display: flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.video}}"></path></svg>My videos</span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid #BDBDBD; font-size: 13px; display: flex; align-items: center">Legs</span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid #BDBDBD; font-size: 13px; display: flex; align-items: center">Dumbbell</span>
</div>
</div>
<sc-for list="{{library}}" as="e" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 12px 0 8px; border-top: 1px solid rgba(0,0,0,0.12)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="rgba(0,0,0,0.38)"><path d="{{ic.drag}}"></path></svg>
<div style="width: 44px; height: 44px; border-radius: 4px; background: #E0E0E0; color: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="{{e.icon}}"></path></svg></div>
<div style="flex: 1; min-width: 0"><div style="font-size: 15px">{{e.name}}</div><div style="font-size: 12px; color: rgba(0,0,0,0.6)">{{e.meta}}</div></div>
</div>
</sc-for>
</aside>

<div style="flex: 3 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="3">
<section style="background: #FFFFFF; border-radius: 4px; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12)">
<div style="display: flex; align-items: center; padding: 12px 8px 12px 16px"><h2 style="flex: 1; margin: 0; font-size: 16px; font-weight: 500">{{d.title}}</h2><button type="button" aria-label="Day options" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="rgba(0,0,0,0.54)"><path d="{{ic.more}}"></path></svg></button></div>
<sc-for list="{{d.items}}" as="x" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 12px 0 8px; border-top: 1px solid rgba(0,0,0,0.12); background: {{x.bg}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="rgba(0,0,0,0.38)"><path d="{{ic.drag}}"></path></svg>
<span style="height: 24px; min-width: 28px; padding: 0 6px; border-radius: 12px; background: #EEEEEE; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{x.code}}</span>
<div style="flex: 1; min-width: 0"><div style="font-size: 15px">{{x.name}}</div><div style="font-size: 13px; color: rgba(0,0,0,0.6)">{{x.rx}}</div></div>
</div>
</sc-for>
<div style="padding: 4px 8px 8px; border-top: 1px solid rgba(0,0,0,0.12)"><button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.add}}"></path></svg>Add exercise</button></div>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#006A60","options":["#006A60","#3F51B5","#9C4146","#4F5B92"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = this.props.primary ?? '#006A60';
    const ic = {
      back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
      copy: 'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z',
      assign: 'M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
      search: 'M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
      video: 'M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z',
      image: 'M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z',
      drag: 'M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
      more: 'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
      add: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z'
    };
    const weeks = ['P1 · W1', 'W2', 'W3', 'W4 deload', 'P2 · W5–8', 'P3 · W9–12'].map((label) => {
      const on = label === 'W3';
      return { label, on, line: on ? primary : 'transparent', fg: on ? primary : 'rgba(0,0,0,0.6)' };
    });
    const library = [
      { name: 'Landmine Press', meta: 'Shoulders · your video', icon: ic.video },
      { name: 'Goblet Squat', meta: 'Legs · your video', icon: ic.video },
      { name: 'Bulgarian Split Squat', meta: 'Legs · starter image', icon: ic.image },
      { name: 'Copenhagen Plank', meta: 'Core · starter image', icon: ic.image }
    ];
    const ss = '#E3F2EF';
    const days = [
      { title: 'Day 1 · Lower A', items: [
        { code: 'A1', name: 'Barbell Back Squat', rx: '3 × 8 · 65% · 3-1-1 · rest 2:00', bg: 'transparent' },
        { code: 'B1', name: 'Romanian Deadlift', rx: '3 × 10 · RPE 7 · superset', bg: ss },
        { code: 'B2', name: 'Walking Lunge', rx: '3 × 12 each · rest 1:30', bg: ss },
        { code: 'C1', name: 'Copenhagen Plank', rx: '3 × 20s each', bg: 'transparent' }
      ] },
      { title: 'Day 2 · Upper A', items: [
        { code: 'A1', name: 'Bench Press', rx: '4 × 6 · 70% · rest 2:30', bg: 'transparent' },
        { code: 'B1', name: 'Chest-Supported Row', rx: '3 × 10 · RPE 8', bg: 'transparent' }
      ] },
      { title: 'Day 3 · Full Body', items: [
        { code: 'A1', name: 'Trap Bar Deadlift', rx: '4 × 5 · RPE 7', bg: 'transparent' }
      ] }
    ];
    return { primary, ic, weeks, library, days };
  }
}
</script>
</body>
</html>
