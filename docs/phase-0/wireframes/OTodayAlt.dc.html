<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today · Orion-style charts (alt)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: Roboto, system-ui, sans-serif; color: #161D1C">
<header style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; flex-shrink: 0">
<div style="flex: 1"><div style="font-size: 12px; color: #3F4947">Tuesday, Oct 20</div><div style="font-size: 22px">Good morning, Jordan</div></div>
<div style="width: 40px; height: 40px; border-radius: 20px; background: #006A60; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px">JR</div>
</header>

<div style="flex: 1; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<section style="background: #CCE8E2; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; color: #051F1C">
<div style="flex: 1"><div style="font-size: 12px; font-weight: 500; letter-spacing: 0.04em">TODAY'S WORKOUT</div><div style="font-size: 18px; font-weight: 500">Lower Body A · 45 min</div></div>
<span style="height: 36px; padding: 0 16px; border-radius: 18px; background: #006A60; color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center">Start</span>
</section>

<section style="border: 1px solid #ECEEF3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(16,24,40,0.05)">
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 13px; font-weight: 500; color: #5B6170">Weight</span><span style="font-size: 12px; color: #5B6170">Last 8 weeks</span></div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">162.4</span><span style="font-size: 14px; color: #5B6170">lb</span>
<span style="height: 24px; padding: 0 8px; border-radius: 12px; background: #E8F1FC; color: #1A5BA8; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 2px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="{{down}}"></path></svg>3.6 lb since Sep 1</span>
</div>
<svg role="img" aria-label="Weight trend from 166.0 to 162.4 lb over 8 weeks" viewBox="0 0 326 84" style="display: block; width: 100%; height: auto">
<defs><linearGradient id="otw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A78D6" stop-opacity="0.22"></stop><stop offset="1" stop-color="#2A78D6" stop-opacity="0"></stop></linearGradient></defs>
<line x1="0" x2="326" y1="20" y2="20" stroke="#E6E9F0" stroke-dasharray="3 4"></line>
<line x1="0" x2="326" y1="50" y2="50" stroke="#E6E9F0" stroke-dasharray="3 4"></line>
<path d="{{w.area}}" fill="url(#otw)"></path>
<path d="{{w.line}}" fill="none" stroke="#2A78D6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
<circle cx="{{w.lx}}" cy="{{w.ly}}" r="5" fill="#FFFFFF" stroke="#2A78D6" stroke-width="2.5"></circle>
</svg>
</section>

<section style="border: 1px solid #ECEEF3; border-radius: 16px; padding: 16px; display: flex; gap: 16px; align-items: center; box-shadow: 0 1px 2px rgba(16,24,40,0.05)">
<div style="position: relative; width: 104px; height: 104px; flex-shrink: 0">
<svg role="img" aria-label="1,240 of 1,900 calories eaten, 65 percent" viewBox="0 0 104 104" width="104" height="104">
<circle cx="52" cy="52" r="44" fill="none" stroke="#EEF1F6" stroke-width="12"></circle>
<circle cx="52" cy="52" r="44" fill="none" stroke="#2A78D6" stroke-width="12" stroke-linecap="round" stroke-dasharray="{{ring.dash}}" transform="rotate(-90 52 52)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 20px; font-weight: 700">660</span><span style="font-size: 11px; color: #5B6170">kcal left</span></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
<div>
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{m.c}}"></span>{{m.name}}</span><span style="color: #5B6170"><strong style="color: #161D1C; font-weight: 500">{{m.v}}</strong> / {{m.t}} g</span></div>
<div style="height: 8px; border-radius: 4px; background: #EEF1F6; margin-top: 5px"><div style="width: {{m.pct}}; height: 8px; border-radius: 4px; background: {{m.c}}"></div></div>
</div>
</sc-for>
</div>
</section>

<section style="border: 1px solid #ECEEF3; border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.05)">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 500; color: #5B6170">Steps this week</span><span style="font-size: 12px; color: #5B6170">Goal 10k / day</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 72px; margin-top: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><div style="width: 100%; max-width: 22px; height: {{s.h}}; border-radius: 6px 6px 2px 2px; background: {{s.c}}"></div></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="7"><span style="font-size: 11px; text-align: center; color: {{s.tc}}; font-weight: {{s.fw}}">{{s.d}}</span></sc-for>
</div>
</section>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 80px; background: #F5F5F5; flex-shrink: 0; padding-bottom: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #3F4947; font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; border-radius: 16px; background: {{t.bg}}"></span>{{t.label}}</span>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [166.0, 165.4, 165.1, 164.2, 164.5, 163.6, 163.0, 162.4];
    const sx = (i) => 6 + i * (314 / 7);
    const sy = (v) => 74 - ((v - 161.5) / 5) * 64;
    const line = pts.map((v, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(v).toFixed(1)).join(' ');
    const area = line + ' L' + sx(7).toFixed(1) + ' 84 L' + sx(0).toFixed(1) + ' 84 Z';
    const C = 2 * Math.PI * 44;
    const macros = [
      { name: 'Protein', v: 98, t: 150, c: '#2A78D6' },
      { name: 'Carbs', v: 110, t: 190, c: '#EB6834' },
      { name: 'Fat', v: 42, t: 63, c: '#1BAF7A' }
    ].map((m) => ({ ...m, pct: Math.round(m.v / m.t * 100) + '%' }));
    const vals = [9200, 11400, 7800, 10300, 6412, 0, 0];
    const steps = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => ({
      d, h: Math.max(4, Math.round(vals[i] / 12000 * 100)) + '%',
      c: i === 4 ? '#2A78D6' : (vals[i] ? '#C9DCF4' : '#EEF1F6'),
      tc: i === 4 ? '#161D1C' : '#5B6170', fw: i === 4 ? 700 : 400
    }));
    const tabs = ['Today', 'Train', 'Food', 'Challenges', 'Classes'].map((label, i) => ({ label, bg: i === 0 ? '#CCE8E2' : 'transparent' }));
    return {
      down: 'M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z',
      w: { line, area, lx: sx(7), ly: sy(162.4) },
      ring: { dash: (C * 0.65).toFixed(1) + ' ' + C.toFixed(1) },
      macros, steps, tabs
    };
  }
}
</script>
</body>
</html>
