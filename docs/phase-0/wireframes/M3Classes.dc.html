<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classes · Material</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: Roboto, system-ui, sans-serif; color: #161D1C">
<header style="display: flex; align-items: center; height: 64px; padding: 0 16px; flex-shrink: 0">
<h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 400">Classes</h1>
<button type="button" aria-label="Calendar view" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #3F4947; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.event}}"></path></svg></button>
</header>

<div style="flex: 1; overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<section style="background: #E8F1FC; color: #0B2A55; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.ticket}}"></path></svg><span style="font-size: 14px; font-weight: 500">Small Group Package</span></div>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 36px">6</span><span style="font-size: 16px">of 10 sessions left</span></div>
<div style="height: 4px; border-radius: 2px; background: #FFFFFF"><div style="width: 60%; height: 4px; border-radius: 2px; background: #2A78D6"></div></div>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px">Expires Dec 15</span><a href="#" style="height: 40px; padding: 0 12px; display: flex; align-items: center; border-radius: 20px; font-size: 14px; font-weight: 500; text-decoration: none; color: {{primary}}">Buy package</a></div>
</section>

<div style="display: flex; gap: 8px; overflow-x: auto">
<button type="button" style="height: 32px; padding: 0 12px 0 8px; border-radius: 8px; border: 0; background: #CCE8E2; color: #051F1C; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.check}}"></path></svg>All</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #6F7977; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #3F4947; flex-shrink: 0">Small group</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #6F7977; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #3F4947; flex-shrink: 0">Public events</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #6F7977; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #3F4947; flex-shrink: 0">My bookings</button>
</div>

<sc-for list="{{classes}}" as="c" hint-placeholder-count="3">
<article style="background: #FFFFFF; border-radius: 16px; padding: 12px; display: flex; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 1px 3px 1px rgba(0,0,0,0.06)">
<button type="button" aria-label="View flyer for {{c.name}}" style="width: 96px; height: 120px; flex-shrink: 0; border: 0; border-radius: 10px; background: {{c.tint}}; color: #3F4947; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; font-size: 11px; padding: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.image}}"></path></svg>Class flyer</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 500; color: {{primary}}">{{c.when}}</div>
<div style="font-size: 16px; font-weight: 500">{{c.name}}</div>
<div style="font-size: 13px; color: #3F4947">{{c.meta}}</div>
<div style="flex: 1"></div>
<sc-if value="{{c.booked}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; height: 32px; padding: 0 12px 0 8px; border-radius: 8px; background: #CCE8E2; color: #051F1C; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.check}}"></path></svg>Booked</span>
</sc-if>
<sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
<a href="{{c.link}}" style="align-self: flex-start; height: 36px; padding: 0 16px 0 12px; border-radius: 18px; background: {{primary}}; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 6px">Book on {{c.source}}<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.open}}"></path></svg></a>
</sc-if>
</div>
</article>
</sc-for>
<div style="font-size: 12px; color: #3F4947; text-align: center">Tap a flyer to see it full size</div>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 80px; background: #F5F5F5; flex-shrink: 0; padding-bottom: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #3F4947; font-size: 12px; font-weight: 500">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}; color: {{t.fg}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{t.icon}}"></path></svg></span>{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#006A60","options":["#006A60","#3F51B5","#9C4146","#4F5B92"]},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const ic = {

      trophy: 'M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z',
      food: 'M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z',
      image: 'M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z',
      home: 'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',
      event: 'M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z',
      check: 'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
      open: 'M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z',
      ticket: 'M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2z'
    };
    const classes = [
      { when: 'SAT OCT 24 · 9:00 AM', name: 'Small Group Strength', meta: 'Studio · 4 spots left', source: 'Calendly', link: 'https://calendly.com', booked: true, open: false, tint: '#DAE5E1' },
      { when: 'THU OCT 29 · 6:00 PM', name: 'Thursday Bootcamp', meta: 'Studio · 2 spots left', source: 'Calendly', link: 'https://calendly.com', booked: false, open: true, tint: '#E3E1EC' },
      { when: 'SAT OCT 31 · 10:00 AM', name: 'Halloween Sweat', meta: 'Open to the public', source: 'Eventbrite', link: 'https://www.eventbrite.com', booked: false, open: true, tint: '#F2E0D9' }
    ];
    const active = 'Classes';
    const tabs = [
      { label: 'Today', href: 'M3Today.dc.html', icon: ic.home },
      { label: 'Train', href: 'M3Workout.dc.html', icon: ic.fitness },
      { label: 'Food', href: 'M3Food.dc.html', icon: ic.food },
      { label: 'Challenges', href: 'M3Challenge.dc.html', icon: ic.trophy },
      { label: 'Classes', href: 'M3Classes.dc.html', icon: ic.event }
    ].map((t) => ({ ...t, bg: t.label === active ? '#CCE8E2' : 'transparent', fg: t.label === active ? '#051F1C' : '#3F4947' }));
    return { primary: this.props.primary ?? '#006A60', ic, classes, tabs };
  }
}
</script>
</body>
</html>
