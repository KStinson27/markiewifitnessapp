<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client Onboarding · Health Check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#006A60}a:hover{color:#00504A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: Roboto, system-ui, sans-serif; color: #161D1C">
<header style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 4px; flex-shrink: 0">
<button type="button" aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #161D1C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{ic.back}}"></path></svg></button>
<div style="flex: 1; font-size: 16px; font-weight: 500">Step 3 of 6</div>
<button type="button" style="height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 500">Save &amp; exit</button>
</header>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 0 16px; flex-shrink: 0">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6"><div style="height: 4px; border-radius: 2px; background: {{s.bg}}"></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 6px 16px 0; flex-shrink: 0">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6"><div style="font-size: 10px; text-align: center; color: {{s.fg}}">{{s.label}}</div></sc-for>
</div>

<div style="flex: 1; overflow: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div><h1 style="margin: 0; font-size: 26px; font-weight: 400">Health check</h1><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #3F4947">A few questions so your coach can program safely. Only your coach sees your answers.</p></div>
<sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid #EEF0EF">
<div style="font-size: 15px; line-height: 1.4">{{q.text}}</div>
<div role="group" aria-label="{{q.text}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 180px; border: 1px solid #6F7977; border-radius: 18px; overflow: hidden; height: 36px">
<button type="button" aria-pressed="{{q.yes}}" style="border: 0; border-right: 1px solid #6F7977; background: {{q.yesBg}}; font: inherit; font-size: 14px; font-weight: 500; color: #161D1C">Yes</button>
<button type="button" aria-pressed="{{q.no}}" style="border: 0; background: {{q.noBg}}; font: inherit; font-size: 14px; font-weight: 500; color: #161D1C">No</button>
</div>
</div>
</sc-for>
<label style="position: relative; display: block; margin-top: 4px"><span style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: #FFFFFF; font-size: 12px; color: #3F4947">Injuries or limitations</span><textarea rows="3" style="width: 100%; box-sizing: border-box; border: 1px solid #6F7977; border-radius: 4px; padding: 14px 16px; font: inherit; font-size: 15px; resize: none">Left knee: meniscus repair 2023, avoid deep lunges</textarea></label>
<div style="display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: #FFF4E5; color: #663C00; font-size: 14px; line-height: 1.4"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#ED6C02" style="flex-shrink: 0"><path d="{{ic.warn}}"></path></svg>You answered yes to one question. We recommend checking with your doctor; your coach will follow up before your first session.</div>
</div>
<div style="padding: 12px 16px 24px; flex-shrink: 0; border-top: 1px solid #EEF0EF">
<button type="button" style="width: 100%; height: 48px; border: 0; border-radius: 24px; background: {{primary}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500">Continue to waiver</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#006A60","options":["#006A60","#3F51B5","#9C4146","#4F5B92"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = this.props.primary ?? '#006A60';
    const ic = {
      back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
      warn: 'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z'
    };
    const steps = ['Goals', 'About you', 'Health', 'Waiver', 'Baseline', 'Permissions'].map((label, i) => ({
      label, bg: i <= 2 ? primary : '#DAE5E1', fg: i === 2 ? '#161D1C' : '#5B6563'
    }));
    const questions = [
      { text: 'Has a doctor ever said you have a heart condition?', yes: false },
      { text: 'Do you feel chest pain during physical activity?', yes: false },
      { text: 'Do you have a bone or joint problem that could get worse with exercise?', yes: true },
      { text: 'Are you pregnant or have you given birth in the last 6 months?', yes: false }
    ].map((q) => ({ ...q, no: !q.yes, yesBg: q.yes ? '#CCE8E2' : 'transparent', noBg: q.yes ? 'transparent' : '#CCE8E2' }));
    return { primary, ic, steps, questions };
  }
}
</script>
</body>
</html>
